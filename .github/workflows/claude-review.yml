name: Claude Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          trigger_phrase: "/claude"

          use_sticky_comment: true
          classify_inline_comments: true
          display_report: true
          show_full_output: true

          prompt: |
            このPRをコードレビューしてください。

            対象PR番号:
            ${{ github.event.issue.number }}

            ghコマンドの追加承認が必要な場合は使わず、
            GitHub Actionsのイベント情報から対象PRを判断してください。

            以下を重点確認:
            - バグ
            - Goベストプラクティス
            - goroutine leak
            - N+1
            - Next.js / TypeScript best practices
            - セキュリティ
            - テスト不足
            - 可読性
            - 過剰設計

            問題がある場合:
            - 問題点
            - 理由
            - 修正案
            を含めてレビューしてください。

            問題がない場合:
            必ず "LGTM" とコメントしてください。

            レビュー結果は必ずGitHub PR commentとして投稿してください。
