name: Claude Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/code-review') &&
      github.event.comment.user.login != 'github-actions[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Review this pull request.

            Review only the changes introduced by this pull request.

            For each concrete issue you find:
            - Post a separate inline review comment on the relevant changed line.
            - Do not combine multiple issues into a single review comment.
            - Prefix the comment with severity: [High], [Medium], or [Low].
            - Briefly explain the problem.
            - Explain why it matters when necessary.
            - Provide a concrete suggested fix when possible.

            Focus on:
            - Bugs and correctness
            - Error handling
            - Security
            - Performance
            - Go best practices
            - Maintainability
            - Missing or insufficient tests

            Avoid commenting on minor stylistic preferences unless they violate
            standard Go conventions such as gofmt.

            Do not duplicate the same finding in both an inline comment and
            a summary comment.

            If a finding cannot be attached to a specific changed line,
            post it as a PR-level comment.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"