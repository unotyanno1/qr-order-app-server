name: Claude Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          direct_prompt: |
            このPRをレビューしてください。

            以下を重点確認:
            - バグや例外漏れ
            - セキュリティリスク
            - DB/API設計の妥当性
            - Goのベストプラクティス
            - goroutine misuse / goroutine leak
            - N+1問題
            - Next.js / TypeScriptのベストプラクティス
            - テスト不足
            - 可読性
            - 過剰設計

            指摘は重要度順にしてください。
            各指摘には以下を含めてください。
            - 問題点
            - 理由
            - 修正案

            問題がない場合は、良い点も簡潔にコメントしてください。
